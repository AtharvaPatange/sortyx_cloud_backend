# Cloud Build configuration for Google Cloud Run deployment
# Automatically builds and deploys on git push

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'BUILDKIT_INLINE_CACHE=1'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sortyx-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sortyx-backend:latest'
      - '-f'
      - 'Dockerfile'
      - '.'
    dir: 'backend'

  # Step 2: Push the image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/sortyx-backend:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/sortyx-backend:latest'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sortyx-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/sortyx-backend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'  # Change to your preferred region
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '2Gi'  # Adjust based on YOLO model requirements
      - '--cpu'
      - '2'  # 2 vCPUs for better performance
      - '--timeout'
      - '300'  # 5 minutes for long-running inference
      - '--max-instances'
      - '10'  # Scale up to 10 instances
      - '--min-instances'
      - '0'  # Scale to zero when idle
      - '--concurrency'
      - '80'
      - '--set-env-vars'
      - 'ENVIRONMENT=production,PORT=8080'
      - '--set-secrets'
      - 'GEMINI_API_KEY=GEMINI_API_KEY:latest'  # Secret from Secret Manager

# Store images in Google Container Registry
images:
  - 'gcr.io/$PROJECT_ID/sortyx-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/sortyx-backend:latest'

# Build options
options:
  machineType: 'E2_HIGHCPU_8'  # Faster builds
  logging: CLOUD_LOGGING_ONLY
  logStreamingOption: STREAM_ON

# Build timeout
timeout: '1800s'  # 30 minutes
